name: Bug report
description: Something doesn't work with your speaker or Home Assistant
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! The most useful thing you can add is the file from **Settings →
        Download diagnostics** in the PartyBox panel: it has every frame and connection event,
        with MAC addresses, names, serial numbers and song titles removed.
  - type: input
    id: model
    attributes:
      label: Speaker model
      placeholder: e.g. PartyBox 310, PartyBox Encore
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Settings → Apps → JBL PartyBox
      placeholder: e.g. 0.4.3
    validations:
      required: true
  - type: input
    id: ha
    attributes:
      label: Home Assistant install and Bluetooth adapter
      placeholder: e.g. HA OS 16.2 on a Raspberry Pi 5, built-in Bluetooth
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Debug log
      description: From the bottom of the PartyBox panel, covering the problem.
      render: text
